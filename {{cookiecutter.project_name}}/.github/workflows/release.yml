name: Release

on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # Required for pushing tags to the repository
          fetch-depth: 2

{% if cookiecutter.dependency_manager_tool == "poetry" %}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: |
          pip install -c ${{ "{{ github.workspace }}" }}/.github/workflows/constraints.txt pip
          pip --version

      - name: Install Poetry
        run: |
          pipx install --pip-args "-c ${{ "{{ github.workspace }}" }}/.github/workflows/constraints.txt" poetry
          pipx inject poetry poetry-plugin-export
          poetry --version
{% else %}
      - name: Get uv version from constraints
        id: uv-version
        shell: pwsh
        run: |
          $UV_VERSION = (Get-Content .github/workflows/constraints.txt | Where-Object { $_ -match '^uv==' } | ForEach-Object { ($_ -split '==')[1] })
          echo "version=$UV_VERSION" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          version: {{ "${{ steps.uv-version.outputs.version }}" }}
          python-version: "3.13"
{% endif %}

      - name: Check if there is a parent commit
        id: check-parent-commit
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "has-parent=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse --verify HEAD^)" >> "$GITHUB_OUTPUT"
            echo "Parent commit detected: true"
          else
            echo "has-parent=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "Parent commit detected: false"
          fi

      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.has-parent == 'true'
        shell: bash
        run: |
          set -euo pipefail

          read_version_from_file() {
            python - "$1" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path(sys.argv[1]).read_text())
          version = (
              data.get("project", {}).get("version")
              or data.get("tool", {}).get("poetry", {}).get("version")
          )

          if not version:
              raise SystemExit("Could not find version in [project] or [tool.poetry]")

          print(version)
          PY
          }

          PREVIOUS_VERSION="$(read_version_from_file <(git show HEAD~1:pyproject.toml))"
          CURRENT_VERSION="$(read_version_from_file pyproject.toml)"

          echo "Previous version: $PREVIOUS_VERSION"
          echo "Current version: $CURRENT_VERSION"

          echo "previous-version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
          echo "current-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "Version has not changed; nothing to tag."
            exit 0
          fi

          TAG="v$CURRENT_VERSION"

          git fetch --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Creating tag $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Released version $CURRENT_VERSION"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version for developmental release
        if: (!steps.check-version.outputs.tag)
        run: |
{% if cookiecutter.dependency_manager_tool == "poetry" %}
          poetry version patch &&
          version=$(poetry version | awk '{ print $2 }') &&
          poetry version $version.dev.$(date +%s)
{% else %}
          uv version --bump patch --frozen &&
          version=$(uv version --short) &&
          uv version $version.dev.$(date +%s) --no-sync
{% endif %}

      - name: Build package
        run: |
{% if cookiecutter.dependency_manager_tool == "poetry" %}
          poetry build --ansi
{% else %}
          uv build
{% endif %}

      - name: Publish package on PyPI
        if: steps.check-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Publish package on TestPyPI
        if: (!steps.check-version.outputs.tag)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish the release notes
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9  # v7.7.0
        with:
          publish: {{ "${{ steps.check-version.outputs.tag != '' }}" }}
          tag: {{ "${{ steps.check-version.outputs.tag }}" }}
        env:
          GITHUB_TOKEN: {{ "${{ secrets.GITHUB_TOKEN }}" }}
